[package]
name = "btree-store"
version = "2.0.0"
edition = "2024"
rust-version = "1.95"
authors = ["AbbyCin <abbytsing@gmail.com>"]
readme = "README.md"
homepage = "https://github.com/abbycin/btree-store"
repository = "https://github.com/abbycin/btree-store"
description = "A persistent, embedded key-value database"
license = "MIT"
keywords = ["database", "kv", "btree", "boltdb", "lmdb"]
categories = ["database-implementations", "data-structures"]

[lib]
crate-type = ["rlib"]

[features]
# Test-only fault points at the CLI-owned publication boundaries. Never enabled
# for a released build; `cargo test --all-features` turns it on so the failure
# ladder can be exercised deterministically.
test-fault-injection = []

[dependencies]
clap = { version = "4.5", default-features = false, features = [
    "std",
    "help",
    "usage",
    "error-context",
] }
crc32c = "0.6.8"
parking_lot = "0.12.5"
rustc-hash = "2.1.1"

[dev-dependencies]
tempfile = "3.0"
rand = "0.9"
criterion = "0.8.1"

[[bench]]
name = "btree_bench"
harness = false
test = false

[profile.release]
lto = true
panic = "abort"
